<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#0d1a0d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff41"/>
      <stop offset="100%" stop-color="#00cc33"/>
    </linearGradient>
  </defs>
  <rect width="180" height="180" rx="24" fill="url(#bg)"/>
  <rect x="4" y="4" width="172" height="172" rx="20" fill="none" stroke="#00ff41" stroke-width="1.5" opacity="0.3"/>
  <!-- Grid lines -->
  <line x1="40" y1="0" x2="40" y2="180" stroke="#00ff41" stroke-width="0.5" opacity="0.08"/>
  <line x1="90" y1="0" x2="90" y2="180" stroke="#00ff41" stroke-width="0.5" opacity="0.08"/>
  <line x1="140" y1="0" x2="140" y2="180" stroke="#00ff41" stroke-width="0.5" opacity="0.08"/>
  <line x1="0" y1="40" x2="180" y2="40" stroke="#00ff41" stroke-width="0.5" opacity="0.08"/>
  <line x1="0" y1="90" x2="180" y2="90" stroke="#00ff41" stroke-width="0.5" opacity="0.08"/>
  <line x1="0" y1="140" x2="180" y2="140" stroke="#00ff41" stroke-width="0.5" opacity="0.08"/>
  <!-- Label -->
  <text x="90" y="82" font-family="monospace" font-size="56" fill="url(#accent)" font-weight="bold" text-anchor="middle">BR</text>
  <text x="90" y="130" font-family="monospace" font-size="11" fill="#00ff41" opacity="0.6" text-anchor="middle">BUGREAPER</text>
  <!-- Terminal cursor accent -->
  <rect x="82" y="148" width="16" height="3" rx="1.5" fill="#00ff41" opacity="0.5"/>
</svg>
